<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CECO Opinion — Acceso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1923;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a2533;
      border: 1px solid #263346;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #00c896, #0099ff);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 12px;
    }
    .logo h1 {
      color: white;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .logo p {
      color: #5a7a9a;
      font-size: 13px;
      margin-top: 4px;
    }
    label {
      display: block;
      color: #7a9ab8;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      margin-top: 20px;
    }
    input {
      width: 100%;
      background: #0f1923;
      border: 1.5px solid #263346;
      border-radius: 8px;
      padding: 12px 14px;
      color: white;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #00c896; }
    button {
      width: 100%;
      margin-top: 28px;
      background: linear-gradient(135deg, #00c896, #0099ff);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .error {
      color: #ff6b6b;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      display: none;
    }
    .error.visible { display: block; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">📊</div>
    <h1>CECO Opinion</h1>
    <p>Panel de gestión de encuestas</p>
  </div>
  <label>Usuario</label>
  <input type="text" id="user" placeholder="Usuario" autocomplete="username">
  <label>Contraseña</label>
  <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password"
    onkeydown="if(event.key==='Enter') login()">
  <button onclick="login()">Entrar</button>
  <div class="error" id="error">Usuario o contraseña incorrectos</div>
</div>
<script>
async function login() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;
  const r = await fetch("/ceco/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({user, password: pass})
  });
  if (r.ok) {
    window.location = "/ceco";
  } else {
    document.getElementById("error").classList.add("visible");
  }
}
</script>
</body>
</html>
