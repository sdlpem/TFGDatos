<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercado de Predicciones — Resultados</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#f5f7fa;
    color:#18212b;
    font-family:Arial,Helvetica,sans-serif;
}
header{
    background:#14202b;
    color:#fff;
    padding:18px 28px;
    display:flex;
    gap:12px;
    align-items:center;
}
header .logo{font-size:22px}
header h1{
    font-size:19px;
    margin:0;
    flex:1;
}
header .status{
    font-size:13px;
    color:#b9c6d2;
}
main{
    max-width:1050px;
    margin:25px auto;
    padding:0 18px;
}
.card{
    background:#fff;
    border:1px solid #e2e7ec;
    border-radius:12px;
    padding:21px;
    margin-bottom:18px;
}
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}
.question{
    font-size:24px;
    line-height:1.3;
    margin:4px 0 9px;
    color:#18212b;
}
.meta{
    font-size:13px;
    color:#74818d;
}
.badge{
    padding:6px 11px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}
.active{
    background:#e5f8ef;
    color:#12804e;
}
.closed{
    background:#eef1f3;
    color:#66737f;
}
.scheduled{
    background:#e8f0ff;
    color:#2864a5;
}
.draft{
    background:#fff3d8;
    color:#936000;
}
.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}
.stat{
    text-align:center;
    background:#f7f9fb;
    border-radius:9px;
    padding:17px 12px;
}
.num{
    font-size:29px;
    font-weight:800;
    color:#18212b;
}
.lbl{
    font-size:11px;
    color:#7b8790;
    text-transform:uppercase;
    margin-top:4px;
}
.section-title{
    font-size:17px;
    font-weight:bold;
    margin:0 0 17px;
}
.result{
    margin:20px 0;
}
.result:last-child{
    margin-bottom:0;
}
.result-head{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-bottom:7px;
    font-size:14px;
}
.result-name{
    font-weight:600;
}
.result-value{
    font-weight:bold;
    color:#138a63;
}
.track{
    width:100%;
    height:14px;
    background:#e9eef1;
    border-radius:20px;
    overflow:hidden;
}
.fill{
    height:100%;
    background:#138a63;
    border-radius:20px;
    transition:width .4s ease;
}
.result-foot{
    display:flex;
    justify-content:space-between;
    margin-top:6px;
    font-size:12px;
    color:#7b8790;
}
.highlight{
    border:1px solid #dbe5df;
    background:#f8fbf9;
}
.notice{
    background:#fff6dc;
    border:1px solid #eedb9c;
    border-radius:8px;
    padding:11px 13px;
    margin-bottom:18px;
    font-size:13px;
    color:#70560e;
}
.empty{
    text-align:center;
    color:#8a969f;
    padding:25px 10px;
}
.footer{
    text-align:center;
    color:#89949d;
    font-size:12px;
    padding:5px 0 25px;
}
.error{
    background:#fff0f1;
    border:1px solid #f0c4c8;
    color:#b13a45;
    border-radius:8px;
    padding:13px;
}
@media(max-width:650px){
    header{
        padding:15px 18px;
    }
    header h1{
        font-size:16px;
    }
    header .status{
        display:none;
    }
    main{
        margin:18px auto;
    }
    .topbar{
        display:block;
    }
    .badge{
        display:inline-block;
        margin-top:12px;
    }
    .question{
        font-size:21px;
    }
    .stats{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <span class="logo">📊</span>
    <h1>Mercado de Predicciones — Resultados</h1>
    <span class="status" id="clock"></span>
</header>

<main>

    <section class="card">
        <div class="topbar">
            <div>
                <div class="meta" id="id"></div>
                <h2 class="question" id="question">Cargando…</h2>
                <div class="meta" id="dates"></div>
            </div>
            <span id="badge" class="badge closed">Cargando…</span>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="num" id="total">—</div>
                <div class="lbl">Respuestas</div>
            </div>
            <div class="stat">
                <div class="num" id="participants">—</div>
                <div class="lbl">Destinatarios</div>
            </div>
            <div class="stat">
                <div class="num" id="participation">—</div>
                <div class="lbl">Participación</div>
            </div>
        </div>
    </section>

    <section class="card">
        <h2 class="section-title">Distribución de respuestas</h2>
        <div id="results">
            <div class="empty">Cargando resultados…</div>
        </div>
    </section>

    <section class="card highlight" id="public-note">
        <div class="section-title">Sobre esta encuesta</div>
        <div class="meta" id="note">
            Los resultados se actualizan automáticamente.
        </div>
    </section>

    <div class="footer">
        Mercado de Predicciones · Resultados de la encuesta
    </div>

</main>

<script>
const $ = id => document.getElementById(id);

function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[c]));
}

function updateClock(){
    $("clock").textContent = new Date().toLocaleTimeString("es-ES", {
        hour:"2-digit",
        minute:"2-digit"
    });
}
updateClock();
setInterval(updateClock, 60000);

function estadoClase(estado, activa){
    if(activa || estado === "ACTIVA") return "active";
    if(estado === "PROGRAMADA") return "scheduled";
    if(estado === "BORRADOR") return "draft";
    return "closed";
}

function estadoTexto(estado, activa){
    if(activa || estado === "ACTIVA") return "🟢 ACTIVA";
    if(estado === "PROGRAMADA") return "🔵 PROGRAMADA";
    if(estado === "BORRADOR") return "🟡 BORRADOR";
    return "⚫ CERRADA";
}

async function cargar(){
    try{
        const response = await fetch("/api/resultados" + window.location.search);
        const data = await response.json();

        if(!response.ok){
            throw new Error(data.error || "No se pudieron cargar los resultados");
        }

        if(!data.encuesta_id){
            $("question").textContent = "No hay una encuesta disponible";
            $("results").innerHTML =
                '<div class="empty">Todavía no hay resultados que mostrar.</div>';
            return;
        }

        $("id").textContent = "ENCUESTA #" + data.encuesta_id;
        $("question").textContent = data.pregunta || "Sin pregunta";

        const estado = data.estado || (data.activa ? "ACTIVA" : "CERRADA");
        const badge = $("badge");
        badge.textContent = estadoTexto(estado, data.activa);
        badge.className = "badge " + estadoClase(estado, data.activa);

        const total = Number(data.total || 0);
        const destinatarios = Number(data.destinatarios || 0);

        $("total").textContent = total;
        $("participants").textContent = destinatarios;

        const participation = destinatarios > 0
            ? Math.round(total / destinatarios * 100) + "%"
            : "—";

        $("participation").textContent = participation;

        let fecha = "";

        if(data.cierre){
            const cierre = new Date(data.cierre);
            if(!isNaN(cierre)){
                fecha = data.activa
                    ? "Cierre previsto: " + cierre.toLocaleString("es-ES", {
                        day:"2-digit",
                        month:"2-digit",
                        year:"numeric",
                        hour:"2-digit",
                        minute:"2-digit"
                    })
                    : "Fecha de cierre: " + cierre.toLocaleString("es-ES", {
                        day:"2-digit",
                        month:"2-digit",
                        year:"numeric",
                        hour:"2-digit",
                        minute:"2-digit"
                    });
            }
        }

        $("dates").textContent = fecha;

        const counts = Object.entries(data.conteo || {})
            .map(([name, count]) => [name, Number(count || 0)])
            .sort((a,b) => b[1] - a[1]);

        if(!counts.length){
            $("results").innerHTML =
                '<div class="empty">Aún no hay respuestas.</div>';
        }else{
            $("results").innerHTML = counts.map(([name, count]) => {
                const percentage = total > 0
                    ? Math.round(count / total * 100)
                    : 0;

                return `
                    <div class="result">
                        <div class="result-head">
                            <span class="result-name">${escapeHtml(name)}</span>
                            <span class="result-value">${percentage}%</span>
                        </div>
                        <div class="track">
                            <div class="fill" style="width:${percentage}%"></div>
                        </div>
                        <div class="result-foot">
                            <span>${count} voto${count !== 1 ? "s" : ""}</span>
                            <span>${percentage}% del total</span>
                        </div>
                    </div>
                `;
            }).join("");
        }

        if(data.activa){
            $("note").textContent =
                "La encuesta está activa. Los resultados se actualizan automáticamente.";
        }else{
            $("note").textContent =
                "Esta encuesta está cerrada. Sus resultados se conservan en el histórico.";
        }

    }catch(error){
        console.error(error);
        $("question").textContent = "No se pudieron cargar los resultados";
        $("results").innerHTML =
            '<div class="error">' + escapeHtml(error.message) + '</div>';
    }
}

cargar();
setInterval(cargar, 5000);
</script>

</body>
</html>
